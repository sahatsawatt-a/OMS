name: oms

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oms}
      MYSQL_USER: ${MYSQL_USER:-oms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # Stripe keys can live in the root .env or backend/.env (backend/.env wins)
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-oms}:${MYSQL_PASSWORD:-oms}@db:3306/${MYSQL_DATABASE:-oms}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5180}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Public HTTPS tunnel to the frontend, e.g. for scanning table QR codes from a phone.
  # Start with: docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:3-alpine
    restart: unless-stopped
    profiles: ["tunnel"]
    command: http frontend:5173 --url=https://${NGROK_URL:?set NGROK_URL in .env} --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    depends_on:
      - frontend

volumes:
  mysql_data:
