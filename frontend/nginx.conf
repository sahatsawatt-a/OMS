# Rate limits per guest IP (REQ-36). A whole restaurant can share one Wi-Fi address, so they
# are generous: they only stop a script hammering the API, not a busy Friday night.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=join:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=sockets:10m;

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Behind ngrok (or any proxy on the Docker network) the guest's address is in X-Forwarded-For;
  # without this every guest would look like one client
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_status 429;
  limit_conn_status 429;

  # Never tell other sites which page a guest came from (add_header in a location replaces
  # these, so the locations below that set headers repeat it)
  add_header Referrer-Policy "same-origin" always;

  # API calls go to the FastAPI backend container
  location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Joining a table: a few phones at once is normal, hundreds is not
  location = /api/guest/join {
    limit_req zone=join burst=30 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Live updates: a WebSocket kept open (the backend pings every 25 s)
  location = /api/ws {
    limit_conn sockets 100;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Hashed build files never change, so cache them for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Referrer-Policy "same-origin" always;
  }

  location /menu/ {
    expires 7d;
  }

  # Single-page app: unknown paths load index.html and the router takes over
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "same-origin" always;
  }
}
